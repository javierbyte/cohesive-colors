name: Deploy

# Publishes the static export to the gh-pages branch, so
# javier.xyz/cohesive-colors can be served from
# javierbyte.github.io/cohesive-colors like the other tools.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          # Next writes assets to _next/, and jekyll skips underscore
          # directories, so the .nojekyll this adds is load-bearing here.
          enable_jekyll: false
